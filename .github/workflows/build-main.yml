
name: Build main

on:
  push:
    branches:
      - 'main'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:

  check_source:
    name: "Run code checks"
    uses: ./.github/workflows/_shared-check.yaml

  build_binaries:
    name: "Build proof-gateway"
    needs: [check_source]
    uses: ./.github/workflows/_shared-build.yaml
    with:
      release: "snapshot"
      docker: true
      docker_repository: "pk910/proof-gateway"
      docker_tag_prefix: "main"
      additional_tags: "['main','main-latest']"
    secrets:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}

  create_snapshot_release:
    name: Create snapshot release
    needs: [build_binaries]
    runs-on: ubuntu-latest
    steps:
    - name: "Download build artifacts"
      uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2

    # (re)create snapshot binary release
    - name: Update snapshot tag & remove previous snapshot release
      uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
      with:
        github-token: ${{secrets.GITHUB_TOKEN}}
        script: |
          try {
            var snapshotTag = "snapshot";
            var snapshotRelease = await github.rest.repos.getReleaseByTag({
              owner: context.repo.owner,
              repo: context.repo.repo,
              tag: snapshotTag
            });
            if(snapshotRelease && snapshotRelease.data && snapshotRelease.data.tag_name == snapshotTag) {
              console.log("delete previous snapshot release");
              await github.rest.repos.deleteRelease({
                owner: context.repo.owner,
                repo: context.repo.repo,
                release_id: snapshotRelease.data.id
              });
            }
          } catch (e) {
            console.log(e)
          }
          try {
            var snapshotRef = await github.rest.git.getRef({
              owner: context.repo.owner,
              repo: context.repo.repo,
              ref: "tags/" + snapshotTag
            });
            if(snapshotRef.data.object.sha !== context.sha) {
              await github.rest.git.updateRef({
                owner: context.repo.owner,
                repo: context.repo.repo,
                ref: "tags/" + snapshotTag,
                sha: context.sha,
                force: true,
              });
            }
          } catch (e) {
            await github.rest.git.createRef({
              owner: context.repo.owner,
              repo: context.repo.repo,
              ref: "refs/tags/" + snapshotTag,
              sha: context.sha,
            });
          }

    - name: "Generate release package: proof-gateway_snapshot_linux_amd64.tar.gz"
      run: |
        cd proof-gateway_linux_amd64
        tar -czf ../proof-gateway_snapshot_linux_amd64.tar.gz .
    - name: "Generate release package: proof-gateway_snapshot_linux_arm64.tar.gz"
      run: |
        cd proof-gateway_linux_arm64
        tar -czf ../proof-gateway_snapshot_linux_arm64.tar.gz .

    - name: Create snapshot release
      uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
      with:
        draft: false
        prerelease: true
        name: "Dev Snapshot"
        tag_name: "snapshot"
        body: |
          ## Latest automatically built executables. (Unstable development snapshot)
          Built from main branch (commit: ${{ github.sha }})

          Docker image: `pk910/proof-gateway:main`

          ### Release Artifacts
          | Release File  | Description |
          | ------------- | ------------- |
          | [proof-gateway_snapshot_linux_amd64.tar.gz](https://github.com/pk910/proof-gateway/releases/download/snapshot/proof-gateway_snapshot_linux_amd64.tar.gz) | proof-gateway executable for linux/amd64 |
          | [proof-gateway_snapshot_linux_arm64.tar.gz](https://github.com/pk910/proof-gateway/releases/download/snapshot/proof-gateway_snapshot_linux_arm64.tar.gz) | proof-gateway executable for linux/arm64 |
        files: |
          proof-gateway_snapshot_linux_amd64.tar.gz
          proof-gateway_snapshot_linux_arm64.tar.gz
