
name: Reusable check workflow
on:
  workflow_call:

permissions:
  contents: read

# shared check jobs
jobs:
  check_source:
    name: Run code checks
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    # setup global dependencies
    - name: Set up go
      uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
      with:
        go-version: 1.26.x
        check-latest: true

    - name: Verify dependencies
      run: go mod verify

    - name: Run go vet
      run: go vet ./...

    - name: Check go fmt
      run: if [ "$(gofmt -s -l . | wc -l)" -gt 0 ]; then gofmt -s -l .; exit 1; fi

    # Pinned rather than @latest: staticcheck's go directive tracks the current Go
    # release, so @latest starts requiring a newer toolchain than the one set above.
    # Bump this with go-version.
    - name: Install staticcheck
      run: go install honnef.co/go/tools/cmd/staticcheck@v0.8.1
    - name: Run staticcheck
      run: staticcheck ./...

    - name: Run tests
      run: go test -race -vet=off ./...

    - name: Build proof-gateway
      run: make build
